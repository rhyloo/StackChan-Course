; Stack-chan VR: firmware del robot (M5Stack CoreS3 + GC0308 + 2 servos SCS0009).
; Compilar y flashear: ./tools/flash.sh   (o: pio run -t upload)
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    m5stack/M5Unified@0.2.21
