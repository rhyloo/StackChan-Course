; Demo 12 - Mini TV: videos from the microSD card on the robot's screen, uploaded from the laptop over Wi-Fi.
; Easiest: demos/12-mini-tv/run.sh (builds, flashes and uploads two sample videos).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (made by setup)
lib_extra_dirs = ../../../lib     ; StackChanHW (power rails, base LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
