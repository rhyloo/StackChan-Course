; Demo 13 - Stack-chan as a web server: a page with the camera, the head, the face, the LEDs
; and every sensor live (HTTP + WebSocket), and optionally MQTT / Home Assistant.
; Easiest: demos/13-web-server/run.sh (builds, flashes and shows the robot's address).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup)
; The web page is a normal file, built into the firmware as it is: edit src/web/index.html.
board_build.embed_txtfiles = src/web/index.html
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs, battery, camera)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    bblanchon/ArduinoJson@7.2.1
