; Demo 15 - OTA on demand: the same OTA base idea as ../firmware, but the OTA is OFF
; while the test runs (the Wi-Fi, the screen and the CPU are the test's). Hold the screen
; 3 s for the menu -> "Activate OTA": the robot restarts waiting for an update.
; Send a test: demos/15-ota/run.sh send side-leds   (first time over USB: ./tools/flash.sh demos/15-ota/on-demand)
;
; New test: copy src/tests/screen-colors to src/tests/mytest and add at the end:
;     [env:mytest]
;     build_src_filter = ${env.build_src_filter} +<tests/mytest/>
;     build_flags = ${env.build_flags} -DTEST_NAME=\"mytest\"
[platformio]
default_envs = side-leds

[env]
platform = espressif32@7.1.2
board = m5stack-cores3            ; its partition table (default_16MB.csv) has two app slots: app0 and app1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup)
; The base (src/*.cpp) plus only this environment's test.
build_src_filter = +<*> -<tests/>
lib_extra_dirs = ../../../lib     ; StackChanHW (power, LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21

[env:side-leds]
build_src_filter = ${env.build_src_filter} +<tests/side-leds/>
build_flags = ${env.build_flags} -DTEST_NAME=\"side-leds\"

[env:screen-colors]
build_src_filter = ${env.build_src_filter} +<tests/screen-colors/>
build_flags = ${env.build_flags} -DTEST_NAME=\"screen-colors\"

; Every part of the robot on a web page (the page is src/tests/hardware-lab/index.html).
[env:hardware-lab]
build_src_filter = ${env.build_src_filter} +<tests/hardware-lab/>
build_flags = ${env.build_flags} -DTEST_NAME=\"hardware-lab\"
board_build.embed_txtfiles = src/tests/hardware-lab/index.html
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unit-NFC@0.1.2              ; ST25R3916 (demo 04)
    crankyoldgit/IRremoteESP8266@2.9.0    ; infrared (demo 06)
