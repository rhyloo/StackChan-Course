; Demo 15 - Updates over Wi-Fi (OTA): a base that receives new firmware over Wi-Fi,
; and small tests that run on top of it. One environment per test (src/tests/<name>/).
; Easiest: demos/15-ota/run.sh the first time (USB), then demos/15-ota/run.sh send <test>.
;
; New test: copy src/tests/hello to src/tests/mytest and add at the end:
;     [env:mytest]
;     build_src_filter = ${env.build_src_filter} +<tests/mytest/>
;     build_flags = ${env.build_flags} -DTEST_NAME=\"mytest\"   ; the name the robot shows
[platformio]
default_envs = hello              ; what the first USB flash (and setup) builds

[env]
platform = espressif32@7.1.2
board = m5stack-cores3            ; its partition table (default_16MB.csv) has two app slots: app0 and app1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup)
; The OTA base (src/*.cpp) plus only this environment's test.
build_src_filter = +<*> -<tests/>
lib_extra_dirs = ../../../lib     ; StackChanHW (power, servos, LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21

[env:hello]
build_src_filter = ${env.build_src_filter} +<tests/hello/>
build_flags = ${env.build_flags} -DTEST_NAME=\"hello\"

[env:leds]
build_src_filter = ${env.build_src_filter} +<tests/leds/>
build_flags = ${env.build_flags} -DTEST_NAME=\"leds\"

[env:head]
build_src_filter = ${env.build_src_filter} +<tests/head/>
build_flags = ${env.build_flags} -DTEST_NAME=\"head\"

[env:crash]
build_src_filter = ${env.build_src_filter} +<tests/crash/>
build_flags = ${env.build_flags} -DTEST_NAME=\"crash\"
