; Demo 09 - Modules of the 37-sensor kit (KY-0xx) on PORT.B: digital, analog, DHT11,
; DS18B20, encoder, joystick and outputs. Easiest way: demos/09-sensor-kit/run.sh
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../../../lib     ; StackChanHW (5 V on the Grove ports, base LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    paulstoffregen/OneWire@2.3.8   ; 1-Wire bus of the DS18B20 (KY-001)
