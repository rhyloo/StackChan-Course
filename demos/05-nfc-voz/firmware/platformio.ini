; Demo 05 - Escribir tarjetas NFC con la voz: micro y altavoz de la demo 02 + lector NFC de la demo 04.
; Lo más fácil: demos/05-nfc-voz/run.sh (compila, flashea y arranca la pasarela).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config                      ; wifi_secrets.h (generado por setup)
    -I${PROJECT_DIR}/../../02-voz-gemini/firmware/src     ; audio.h
; The audio (mic and speaker over UDP) is the one from demo 02, compiled in as is.
build_src_filter = +<*> +<../../../02-voz-gemini/firmware/src/audio.cpp>
lib_extra_dirs = ../../../lib     ; StackChanHW (base y LEDs) y StackChanLink (UDP con el portátil)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2       ; driver del ST25R3916 (NFC-A, NDEF)
