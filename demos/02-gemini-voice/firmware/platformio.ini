; Demo 02 - Voice with Gemini: the demo 01 firmware + microphone and speaker over UDP.
; Flash from the repo root: ./tools/flash.sh demos/02-gemini-voice/firmware
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup)
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs, battery, camera) and StackChanLink (UDP with the laptop)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
