; Demo 05 - Write NFC cards with your voice: demo 02 mic and speaker + demo 04 NFC reader.
; Easiest: demos/05-nfc-voice/run.sh (builds, flashes and starts the relay).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config                      ; wifi_secrets.h (created by setup)
    -I${PROJECT_DIR}/../../02-gemini-voice/firmware/src     ; audio.h
; The audio (mic and speaker over UDP) is the one from demo 02, compiled in as is.
build_src_filter = +<*> +<../../../02-gemini-voice/firmware/src/audio.cpp>
lib_extra_dirs = ../../../lib     ; StackChanHW (base and LEDs) and StackChanLink (UDP with the laptop)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2       ; ST25R3916 driver (NFC-A, NDEF)
