; Demo 16 - Math game: sums, subtractions, times tables and divisions on the touch screen,
; with pictures to count, a Stack-chan that cheers, and statistics kept on the robot.
; Easiest: demos/16-math-game/run.sh (builds, flashes and opens the serial monitor).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup): the statistics page
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
