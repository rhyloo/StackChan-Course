; Demo 11 - Keyestudio KS0428 tank (Arduino UNO + L298P shield + HM-10 Bluetooth).
; It gets each track's speed over Bluetooth and stops by itself if the commands stop coming.
; REMOVE THE BLUETOOTH MODULE before flashing (it shares the USB serial port) and put it back afterwards:
;   demos/11-tank/run.sh tank
[env:uno]
platform = atmelavr@5.3.0
board = uno
framework = arduino
monitor_speed = 9600
