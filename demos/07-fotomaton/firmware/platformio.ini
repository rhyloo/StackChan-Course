; Demo 07 - Fotomatón: foto con cuenta atrás, filtro temático (Gemini / OpenCV) e impresión en una MX10 por Bluetooth.
; Lo más fácil: demos/07-fotomaton/run.sh (compila, flashea y arranca la pasarela).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
board_build.partitions = huge_app.csv   ; Wi-Fi + Bluetooth + cámara no caben en la partición por defecto de 3 MB
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (generado por setup)
lib_extra_dirs = ../../../lib     ; StackChanHW (cámara, LEDs) y StackChanLink (UDP con el portátil)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
    h2zero/NimBLE-Arduino@1.4.3   ; Bluetooth LE ligero, para la impresora
