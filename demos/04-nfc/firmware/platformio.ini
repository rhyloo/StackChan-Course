; Demo 04 - NFC: el robot lee etiquetas NFC con el ST25R3916 de la base y enseña lo que llevan.
; Flashear desde la raíz del repo: ./tools/flash.sh demos/04-nfc/firmware
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../../../lib     ; StackChanHW (alimentación de la base y LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2       ; driver del ST25R3916 (NFC-A, NDEF), sobre M5UnitUnified
