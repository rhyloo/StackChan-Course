; Demo 04 - NFC: the robot reads NFC tags with the base's ST25R3916 and shows what they hold.
; Flash from the repo root: ./tools/flash.sh demos/04-nfc/firmware
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../../../lib     ; StackChanHW (base power and LEDs)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2       ; ST25R3916 driver (NFC-A, NDEF), on top of M5UnitUnified
