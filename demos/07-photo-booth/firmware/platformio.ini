; Demo 07 - Photo booth: photo with a countdown, a themed filter (Gemini / OpenCV) and a print on an MX10 over Bluetooth.
; Easiest: demos/07-photo-booth/run.sh (builds, flashes and starts the relay).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
board_build.partitions = huge_app.csv   ; Wi-Fi + Bluetooth + camera don't fit in the default 3 MB partition
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (made by setup)
lib_extra_dirs = ../../../lib     ; StackChanHW (camera, LEDs) and StackChanLink (UDP with the laptop)
lib_deps =
    StackChanHW
    StackChanLink
    m5stack/M5Unified@0.2.21
    h2zero/NimBLE-Arduino@1.4.3   ; lightweight Bluetooth LE, for the printer
