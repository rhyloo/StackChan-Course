; Demo 08 - SG90 servo on Stack-chan's PORT.B (signal on G9 and G8), moved from the touch screen.
; Easiest: demos/08-servo-sg90/run.sh (builds, flashes and opens the serial monitor).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_extra_dirs = ../../../lib     ; StackChanHW (power for the Grove ports)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
