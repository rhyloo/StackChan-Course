; Demo 03 - Baliza ESP-NOW para una ESP32 DevKit clásica (ESP32-WROOM).
; Hay tres entornos, uno por baliza. Desde la raíz del repo:
;   ./tools/flash.sh demos/03-espnow-balizas/baliza --env baliza1
;   ./tools/flash.sh demos/03-espnow-balizas/baliza --env baliza2
;   ./tools/flash.sh demos/03-espnow-balizas/baliza --env baliza3
[env]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/..                ; espnow_msg.h
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (para saber el canal de la Wi-Fi)

[env:baliza1]
build_flags = ${env.build_flags} -DBEACON_ID=1

[env:baliza2]
build_flags = ${env.build_flags} -DBEACON_ID=2

[env:baliza3]
build_flags = ${env.build_flags} -DBEACON_ID=3
