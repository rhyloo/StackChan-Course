; Demo 03 - ESP-NOW beacon for a classic ESP32 DevKit (ESP32-WROOM).
; There are three environments, one per beacon. From the repo root:
;   ./tools/flash.sh demos/03-espnow-beacons/beacon --env beacon1
;   ./tools/flash.sh demos/03-espnow-beacons/beacon --env beacon2
;   ./tools/flash.sh demos/03-espnow-beacons/beacon --env beacon3
[env]
platform = espressif32@7.1.2
board = esp32dev
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -I${PROJECT_DIR}/..                ; espnow_msg.h
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (to find the Wi-Fi channel)

[env:beacon1]
build_flags = ${env.build_flags} -DBEACON_ID=1

[env:beacon2]
build_flags = ${env.build_flags} -DBEACON_ID=2

[env:beacon3]
build_flags = ${env.build_flags} -DBEACON_ID=3
