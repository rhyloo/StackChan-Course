; Demo 03 - Receiver: Stack-chan listens to the ESP-NOW beacons.
; From the repo root: ./tools/flash.sh demos/03-espnow-beacons/receiver
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/..                ; espnow_msg.h
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h
lib_extra_dirs = ../../../lib
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
