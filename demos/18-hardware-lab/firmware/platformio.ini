; Demo 18 - Hardware lab: every part of the robot on a web page (the page is src/index.html).
; The same as demo 15's hardware-lab test, without the OTA: flashed over USB like the others.
; Easiest: demos/18-hardware-lab/run.sh (builds, flashes and opens the serial monitor).
[env:m5stack-cores3]
platform = espressif32@7.1.2
board = m5stack-cores3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    esp32_exception_decoder
    time
build_flags =
    -DARDUINO_M5STACK_CORES3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I${PROJECT_DIR}/../../../config   ; wifi_secrets.h (created by setup)
board_build.embed_txtfiles = src/index.html
lib_extra_dirs = ../../../lib     ; StackChanHW (servos, LEDs, camera)
lib_deps =
    StackChanHW
    m5stack/M5Unified@0.2.21
    m5stack/M5Unit-NFC@0.1.2              ; ST25R3916 (demo 04)
    crankyoldgit/IRremoteESP8266@2.9.0    ; infrared (demo 06)
